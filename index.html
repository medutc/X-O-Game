<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X O  Game</title>
    <link rel="stylesheet" href="styleMain.css">
</head>
<body>
    
    <h3 id="currentPlayer">Current Player: X</h3>
    <p id="counter">--</p>
    <div class="container">
            <div class="cell"  onclick="putSymbol(1)"><img src="" alt="" id="1"></div>
            <div class="cell"  onclick="putSymbol(2)"><img src="" alt="" id="2"></div>
            <div class="cell"  onclick="putSymbol(3)"><img src="" alt="" id="3"></div>
            <div class="cell"  onclick="putSymbol(4)"><img src="" alt="" id="4"></div>
            <div class="cell"  onclick="putSymbol(5)"><img src="" alt="" id="5"></div>
            <div class="cell"  onclick="putSymbol(6)"><img src="" alt="" id="6"></div>
            <div class="cell"  onclick="putSymbol(7)"><img src="" alt="" id="7"></div>
            <div class="cell"  onclick="putSymbol(8)"><img src="" alt="" id="8"></div>
            <div class="cell"  onclick="putSymbol(9)"><img src="" alt="" id="9"></div>
    </div>
    <button onclick="resetGame()">Replay</button>
</body>
<script src="code.js"></script>
</html>
